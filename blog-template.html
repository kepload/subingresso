        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        /* Tailwind precompilato manca line-clamp-3: definito qui per il bento blog list (side card title 3 righe). */
        .line-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

<script>
const params = new URLSearchParams(location.search);
const slug = params.get('post');
const container = document.getElementById('blogContainer');
const loading = document.getElementById('loading');

// Lista /blog → main largo (max-w-7xl). Singolo post → resta stretto (max-w-3xl, leggibilità).
// Sincrono prima del fetch così l'intro SSR-iniettata si allinea da subito col layout finale.
// Banner "Quanto vale il tuo posteggio?" è intent-venditore: ha senso solo sui post (non-bandi),
// non sull'indice del blog dove l'utente sta scoprendo i contenuti.
if (!slug) {
    const _bm = document.getElementById('blogMain');
    if (_bm) { _bm.classList.remove('max-w-3xl'); _bm.classList.add('max-w-7xl'); }
    const _bv = document.getElementById('bannerValutatore');
    if (_bv) _bv.classList.add('hidden');
}

// ── Mappa slug articoli "bandi-*" → regione esatta (deve matchare js/data.js per il filtro CTA) ──
const SLUG_TO_REGIONE = BlogMarkup.regions;
const BANDI_PREFIX = 'bandi-posteggi-mercatali-';
function _regioneFromSlug(s) {return BlogMarkup.regionFromSlug(s);}
const _BLOG_REGIONE = _regioneFromSlug(slug);
const _IS_BANDI = !!_BLOG_REGIONE;

// Hub Bolkestein: slug singolo, FAQ JSON-LD dedicate (rich result Google su query "ultime notizie").
const _BOLKESTEIN_HUB_SLUG = 'bolkestein-ambulanti-ultime-notizie-2026';
const _IS_BOLKESTEIN_HUB   = slug === _BOLKESTEIN_HUB_SLUG;

// ── Listener click delegato: traccia CTA regionale + click sulle card del box live ──
document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a || !window.trackBlogConversion) return;
    var href = a.getAttribute('href') || '';
    if (href.indexOf('/annunci?regione=') === 0) {
        try {
            var reg = decodeURIComponent(href.split('regione=')[1] || '').split('&')[0];
            window.trackBlogConversion('cta_annunci_click', slug || null, reg || null);
        } catch (_) {}
    } else if (href === '/annunci' || href.indexOf('/annunci?') === 0 || href.indexOf('/annunci#') === 0) {
        // CTA verso /annunci SENZA filtro regione: hub Bolkestein e articoli non regionali.
        // Prima non scattava (l'if sopra matchava solo ?regione=) → conversioni invisibili. TODO 14.
        window.trackBlogConversion('cta_annunci_click', slug || null, null);
    } else if (href.indexOf('/annuncio?id=') === 0 && a.closest('[data-box-listings]')) {
        // Click su una card del box "Posteggi disponibili adesso"
        const boxRegion = a.closest('[data-box-listings]').getAttribute('data-regione') || null;
        window.trackBlogConversion('box_listing_click', slug || null, boxRegion);
    }
});

// ── Form Avvisi: HTML + bind handler ──
function _bandoAlertFormHtml(regione) {return BlogMarkup.alertForm(regione);}

function _bindBandoAlertForm(regione, postSlug) {
    window.bindBandoAlertForm('bandoAlertForm', 'bandoAlertMsg', regione, postSlug);
}

function _blogListingPreview(listing) {
    let extra = listing.dettagli_extra;
    if (typeof extra === 'string') { try { extra = JSON.parse(extra); } catch (_) { extra = null; } }
    const rawImages = Array.isArray(listing.img_urls) && listing.img_urls.length ? listing.img_urls : extra?.images;
    const images = Array.isArray(rawImages) ? rawImages.filter(image => typeof image === 'string' && image) : [];
    const featured = isListingFeatured(listing);
    const image = images.length ? images[featured ? Math.floor(Math.random() * images.length) : 0] : null;
    const location = [listing.comune, listing.regione].filter(Boolean).join(', ');
    const rent = listing.stato === 'Affitto mensile';
    return '<a href="/annuncio?id=' + encodeURIComponent(listing.id) + '" data-listing-id="' + escapeHTML(listing.id) + '"'
        + ' class="blog-posteggio' + (rent ? ' blog-posteggio-rent' : '') + (featured ? ' blog-posteggio-featured' : '') + '">'
        + '<span class="blog-posteggio-thumb" aria-hidden="true"><i class="fas fa-store"></i>'
        + (image ? '<img src="' + escapeHTML(getOptimizedImageUrl(image, 192)) + '" alt="" width="56" height="56" loading="lazy" decoding="async" onerror="this.hidden=true">' : '')
        + (featured ? '<span class="blog-posteggio-vetrina">In Vetrina</span>' : '') + '</span>'
        + '<span class="blog-posteggio-info">'
        + '<span class="blog-posteggio-title">' + escapeHTML(listing.titolo || 'Posteggio') + '</span>'
        + '<span class="blog-posteggio-location">' + escapeHTML(location) + '</span>'
        + '<span class="blog-posteggio-price">' + (rent ? 'Affitto' : 'Vendita') + ' · ' + escapeHTML(formatPrice(listing)) + '</span>'
        + '</span></a>';
}

// ── Box "Posteggi disponibili adesso" — fetch + render ──
// Selezione nel DB su tutti gli annunci: geografia del titolo/slug, Vetrine, tema,
// sorteggio fra pari. Nessun limite preliminare ai soli 24 annunci recenti.
let _blogAdsRequest = 0;
async function _loadBandoListingsBox(regione, postSlug) {
    const target = document.getElementById('bandoListingsBox');
    if (!target) return;
    const request = ++_blogAdsRequest;
    const current = () => request === _blogAdsRequest && target.isConnected
        && document.getElementById('bandoListingsBox') === target;
    try {
        const { data: selection, error } = await _supabase.rpc('blog_listing_ads', { p_slug: postSlug, p_limit: 3 });
        if (!current()) return;
        if (error) throw error;
        if (!selection || !Array.isArray(selection.listings) || !Array.isArray(selection.regions)) throw new Error('Ads unavailable');
        const regions = selection.regions.filter(r => Object.values(SLUG_TO_REGIONE).includes(r));
        const localRegion = regions.length === 1 ? regions[0] : null;
        const data = selection.listings.filter(l => l && l.id && l.status === 'active' && isListingFeatured(l) && !isListingExpired(l)
            && (!regions.length || regions.includes(l.regione))).filter((l,index,all) => all.findIndex(other => other.id === l.id) === index).slice(0,3);

        if (!data || data.length === 0) { target.innerHTML = ''; return; }

        const cards = data.map(_blogListingPreview).join('');
        const heading = localRegion ? 'Vetrine Premium in ' + escapeHTML(localRegion)
            : regions.length ? 'Vetrine Premium nelle zone dell’articolo' : 'Posteggi in Vetrina Premium';
        const seeAllUrl = localRegion ? '/annunci?regione=' + encodeURIComponent(localRegion) : '/annunci';
        target.innerHTML = '<section class="not-prose blog-listings" aria-label="Annunci sponsorizzati" data-box-listings' + (localRegion ? ' data-regione="' + escapeHTML(localRegion) + '"' : '') + '>'
            + '<div class="blog-listings-header">'
            +   '<h3>' + heading + '</h3>'
            +   '<a href="' + seeAllUrl + '" class="blog-listings-all">Vedi tutti →</a>'
            + '</div>'
            + '<div class="blog-listings-grid">' + cards + '</div>'
            + '</section>';
        if (typeof observeCardViews === 'function') observeCardViews();
    } catch (e) {
        // Errore silenzioso: il box semplicemente non appare
        if (current()) target.innerHTML = '';
    }
}
// Una pagina ripristinata dalla cache del browser deve rileggere le Vetrine attuali.
window.addEventListener('pageshow', event => {
    if (event.persisted && slug) _loadBandoListingsBox(_BLOG_REGIONE, slug);
});

// ── 3.3 Link città inline (prima occorrenza, max 5/articolo) ──────
const _CITY_LINKS = [
    // Capoluoghi regione (incl. multi-parola)
    "Reggio Calabria","La Spezia","L'Aquila",
    'Roma','Milano','Napoli','Torino','Palermo','Genova','Bologna','Firenze','Bari','Venezia',
    'Aosta','Perugia','Trieste','Trento','Bolzano','Cagliari','Catanzaro','Potenza','Campobasso','Ancona',
    // Top per i bandi reali citati negli articoli
    'Tropea','Pizzo','Diamante','Cosenza','Crotone','Vibo Valentia','Maratea','Matera','Termoli',
    'Pescara','Sulmona','Roccaraso','Pescasseroli','Vasto','Foligno','Spoleto','Assisi','Norcia','Bevagna','Spello',
    'Sanremo','Imperia','Savona','Sirmione','Salò','Brescia','Bergamo','Verona','Padova',
    'Lecce','Taranto','Foggia','Catania','Messina','Siracusa','Trapani','Agrigento',
    'Sassari','Olbia','Alghero','Lignano','Grado','Courmayeur','Cervinia','Merano','Bressanone'
];

// ── 4.1 JSON-LD FAQPage (solo bandi-*, rich result Google) ─────
function _injectFaqJsonLd(regione) {
    if (!regione) {
        const old = document.getElementById('_ldFaq');
        if (old) old.remove();
        return;
    }
    const faqs = [
        {
            q: 'Quando escono i bandi per posteggi mercatali in ' + regione + '?',
            a: 'I calendari variano per Comune. In linea generale: bandi turistici stagionali tra marzo e aprile per la stagione giugno-settembre, bandi mercati ordinari pubblicati periodicamente quando si liberano posteggi, bandi eventistici legati a sagre e festival con tempistiche proprie. Conviene seguire l\'Albo Pretorio dei Comuni capoluogo e iscriversi alle associazioni di categoria.'
        },
        {
            q: 'Dove trovo i bandi nuovi in ' + regione + '?',
            a: 'Le fonti ufficiali sono: l\'Albo Pretorio online di ogni Comune, il Bollettino Ufficiale della Regione ' + regione + ' (BUR), il SUAP regionale per le pratiche di commercio. Le associazioni di categoria (Anva Confesercenti e Fiva Confcommercio) avvisano via mail i propri iscritti.'
        },
        {
            q: 'Posso fare subingresso invece di partecipare al bando in ' + regione + '?',
            a: 'Sì. Il subingresso è la cessione di una licenza ambulante esistente da un titolare a un nuovo operatore. È regolato dalla legge regionale e prevede tempi molto più rapidi del bando: parti in poche settimane, con clientela già fidelizzata. Su Subingresso.it trovi annunci di chi cede o affitta il proprio posteggio in ' + regione + '.'
        },
        {
            q: 'Quanto dura la concessione di un posteggio?',
            a: 'Per la direttiva Bolkestein recepita dall\'Italia la concessione decennale è la regola: dieci anni minimo. Alla scadenza si torna al bando pubblico, con un margine di priorità storica per il titolare uscente nei casi previsti dalla legge regionale.'
        }
    ];
    const ld = {
        '@context': 'https://schema.org',
        '@type':    'FAQPage',
        'mainEntity': faqs.map(f => ({
            '@type': 'Question',
            'name':  f.q,
            'acceptedAnswer': { '@type': 'Answer', 'text': f.a }
        }))
    };
    let el = document.getElementById('_ldFaq');
    if (!el) {
        el = document.createElement('script');
        el.id = '_ldFaq';
        el.type = 'application/ld+json';
        document.head.appendChild(el);
    }
    el.textContent = JSON.stringify(ld);
}

// ── 4.1b JSON-LD FAQPage hub Bolkestein (riusa lo stesso ID _ldFaq, mutex con la versione bandi) ─────
function _injectBolkesteinFaqJsonLd() {
    if (!_IS_BOLKESTEIN_HUB) return;
    const faqs = [
        {
            q: 'Quando partono le gare Bolkestein per gli ambulanti in Italia?',
            a: 'Non c\'è una data unica nazionale. A maggio 2026 le linee guida MIMIT sono ferme da mesi, le Regioni chiedono autonomia, l\'ANCI vuole criteri uniformi. Alcuni Comuni (Sanremo, parte del Veneto e delle Marche) hanno già recepito e avviato bandi, la maggioranza aspetta la cornice nazionale. Previsioni realistiche: 2-3 anni minimo per i grandi Comuni, 4-5 anni per i Comuni medio-piccoli.'
        },
        {
            q: 'Posso ancora fare subingresso di una licenza ambulante nel 2026?',
            a: 'Sì. La direttiva Bolkestein disciplina l\'assegnazione iniziale tramite gara pubblica, non la circolazione di una licenza già esistente tra privati. Finché la concessione è in essere e non è stata rimessa a gara dal Comune, può essere ceduta tramite subingresso davanti al SUAP. Il subentrante eredita la durata residua del titolo.'
        },
        {
            q: 'Cosa succede alla mia licenza ambulante dopo il bando Bolkestein?',
            a: 'Una volta che il Comune bandisce e aggiudica il posteggio, la nuova concessione nasce sotto regime Bolkestein. Niente più diritto di insistenza, durata decennale, gara aperta a tutti. Il titolare uscente può ripresentarsi al bando ma parte alla pari con gli altri candidati. La licenza, di fatto, smette di essere un asset trasferibile.'
        },
        {
            q: 'Cos\'è la procedura di infrazione UE contro l\'Italia sugli ambulanti?',
            a: 'A febbraio 2026 la Commissione Europea ha avviato la procedura di infrazione contro l\'Italia per il mancato adeguamento della disciplina delle concessioni ambulanti alla direttiva 2006/123/CE. Roma ha sessanta giorni per rispondere. Se la procedura prosegue fino alla Corte di Giustizia UE, l\'Italia rischia sanzioni economiche, motivo in più per accelerare il recepimento.'
        },
        {
            q: 'È ancora valido il diritto di insistenza per gli ambulanti?',
            a: 'No. Il diritto di insistenza (la priorità del titolare uscente nel bando successivo) è stato cancellato dalla giurisprudenza europea e da diverse sentenze del Consiglio di Stato e dei TAR regionali italiani. È uno schema vecchio non più applicabile nei nuovi bandi Bolkestein.'
        }
    ];
    const ld = {
        '@context': 'https://schema.org',
        '@type':    'FAQPage',
        'mainEntity': faqs.map(function(f){ return {
            '@type': 'Question',
            'name':  f.q,
            'acceptedAnswer': { '@type': 'Answer', 'text': f.a }
        };})
    };
    let el = document.getElementById('_ldFaq');
    if (!el) {
        el = document.createElement('script');
        el.id = '_ldFaq';
        el.type = 'application/ld+json';
        document.head.appendChild(el);
    }
    el.textContent = JSON.stringify(ld);
}

// ── 4.2 Link a 3 regioni vicine in fondo agli articoli bandi-* ─────
const _NEIGHBORS = {
    'Lombardia': ['Piemonte','Emilia-Romagna','Veneto'],
    'Piemonte': ['Lombardia','Liguria',"Valle d'Aosta"],
    'Lazio': ['Toscana','Umbria','Campania'],
    'Veneto': ['Lombardia','Trentino-Alto Adige','Emilia-Romagna'],
    'Emilia-Romagna': ['Lombardia','Veneto','Toscana'],
    'Toscana': ['Lazio','Emilia-Romagna','Liguria'],
    'Campania': ['Lazio','Puglia','Basilicata'],
    'Puglia': ['Campania','Basilicata','Molise'],
    'Sicilia': ['Calabria','Sardegna','Campania'],
    'Liguria': ['Piemonte','Toscana','Emilia-Romagna'],
    'Marche': ['Emilia-Romagna','Umbria','Abruzzo'],
    'Trentino-Alto Adige': ['Veneto','Lombardia','Friuli-Venezia Giulia'],
    'Sardegna': ['Sicilia','Lazio','Toscana'],
    'Friuli-Venezia Giulia': ['Veneto','Trentino-Alto Adige','Emilia-Romagna'],
    "Valle d'Aosta": ['Piemonte','Lombardia','Liguria'],
    'Umbria': ['Toscana','Marche','Lazio'],
    'Abruzzo': ['Marche','Lazio','Molise'],
    'Molise': ['Abruzzo','Puglia','Campania'],
    'Basilicata': ['Puglia','Calabria','Campania'],
    'Calabria': ['Basilicata','Sicilia','Puglia']
};

function _slugForRegione(regione) {
    const entry = Object.entries(SLUG_TO_REGIONE).find(([, v]) => v === regione);
    return entry ? BANDI_PREFIX + entry[0] : null;
}

function _renderRelatedBandi(regione, allPosts) {
    const target = document.getElementById('relatedBandi');
    if (!target || !regione) return;
    const neighbors = _NEIGHBORS[regione] || [];
    if (!neighbors.length) return;
    const cards = neighbors.map(r => {
        const slug = _slugForRegione(r);
        if (!slug) return '';
        const post = (allPosts || []).find(p => p.slug === slug);
        if (!post) return '';
        return '<a href="/blog?post=' + escapeHTML(slug) + '" class="block p-4 md:p-5 rounded-2xl border border-slate-100 bg-white hover:border-blue-200 hover:shadow-md transition group">'
            + '<p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2">Bandi · ' + escapeHTML(r) + '</p>'
            + '<h4 class="text-sm font-black text-slate-900 leading-tight mb-1.5 group-hover:text-blue-600 transition line-clamp-2">' + escapeHTML(post.title) + '</h4>'
            + '<p class="text-xs text-slate-500 font-medium leading-relaxed line-clamp-2">' + escapeHTML(post.excerpt || '') + '</p>'
            + '</a>';
    }).filter(Boolean).join('');
    if (!cards) return;
    target.innerHTML = '<div class="not-prose mt-12">'
        + '<h3 class="text-xl md:text-2xl font-black text-slate-900 mb-2">Bandi in regioni vicine</h3>'
        + '<p class="text-sm text-slate-500 font-medium mb-5">Se cerchi posteggi in più regioni, dai un\'occhiata anche qui:</p>'
        + '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">' + cards + '</div>'
        + '</div>';
}

function _injectInlineCityLinks(container, articleRegione) {
    if (!container) return;
    const SKIP_TAGS = new Set(['A','STRONG','EM','B','I','H1','H2','H3','H4','H5','H6','BUTTON','CODE','SCRIPT','STYLE']);
    const linked = new Set();
    const MAX_LINKS = 5;
    let added = 0;

    // Sort per lunghezza decrescente: matcha "Reggio Calabria" prima di "Reggio".
    const cities = _CITY_LINKS.slice().sort((a, b) => b.length - a.length);

    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode(n) {
            for (let p = n.parentElement; p && p !== container; p = p.parentElement) {
                if (SKIP_TAGS.has(p.tagName)) return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
        }
    });

    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);

    for (const node of nodes) {
        if (added >= MAX_LINKS) break;
        const text = node.nodeValue || '';
        if (text.length < 4) continue;

        for (const city of cities) {
            if (linked.has(city)) continue;
            // Word boundary unicode-safe: solo se preceduta/seguita da non-lettera.
            const escaped = city.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp('(^|[^A-Za-z\\u00C0-\\u017F])(' + escaped + ')([^A-Za-z\\u00C0-\\u017F]|$)');
            const m = text.match(re);
            if (!m || m.index === undefined) continue;

            const idxCity  = m.index + m[1].length;
            const before   = text.slice(0, idxCity);
            const cityText = m[2];
            const after    = text.slice(idxCity + cityText.length);

            const href = articleRegione
                ? '/annunci?regione=' + encodeURIComponent(articleRegione) + '&q=' + encodeURIComponent(city)
                : '/annunci?q=' + encodeURIComponent(city);

            const a = document.createElement('a');
            a.href = href;
            a.className = 'text-blue-600 hover:underline font-bold';
            a.textContent = cityText;

            const parent = node.parentNode;
            const next = node.nextSibling;
            node.nodeValue = before;
            parent.insertBefore(a, next);
            if (after) parent.insertBefore(document.createTextNode(after), next);

            linked.add(city);
            added++;
            break; // un city per text node, vai avanti
        }
    }
}

let _allPosts = [];

async function loadBlog() {
    try {
        const initial = document.getElementById('blogBootstrap');
        const bootstrap = initial ? JSON.parse(initial.textContent) : null;
        if (bootstrap?.mode === 'not-found') return;
        if (bootstrap?.mode === 'list' && !slug) return;
        if (bootstrap?.mode === 'post' && bootstrap.post?.slug === slug) {
            _allPosts = bootstrap.related || [];
            renderPost(bootstrap.post, {hydrate: true});
            return;
        }

        // Fallback for the static template or a temporary server-side failure.
        // Never download article bodies to render the index or related cards.
        if (slug) {
            const {data: posts, error} = await _supabase.from('blog_posts')
                .select(BlogMarkup.postColumns).eq('slug', slug).limit(1);
            if (error) throw error;
            const post = (posts || []).find(p => p.slug === slug);
            loading.classList.add('hidden');
            container.classList.remove('hidden');
            if (post) {
                renderPost(post);
                if (_IS_BANDI) {
                    const {data: related, error: relatedError} = await _supabase.from('blog_posts')
                        .select(BlogMarkup.previewColumns).like('slug', BANDI_PREFIX + '%');
                    if (!relatedError) {
                        _allPosts = related || [];
                        _renderRelatedBandi(_BLOG_REGIONE, _allPosts);
                    }
                }
            } else {
                container.innerHTML = `<div class="text-center">Post non trovato. <a href="/blog" class="text-blue-600 underline">Torna all'indice</a></div>`;
            }
        } else {
            const {data: posts, error} = await _supabase.from('blog_posts')
                .select(BlogMarkup.previewColumns).order('published_at', {ascending: false});
            if (error) throw error;
            _allPosts = posts || [];
            renderList(_allPosts);
            loading.classList.add('hidden');
            container.classList.remove('hidden');
        }
    } catch (err) {
        console.error(err);
        // Existing readable server content stays visible even if an enhancement fails.
        if (!container.querySelector('#blogPostContent')) {
            loading.classList.remove('hidden');
            loading.innerHTML = `<p class="text-red-500">Errore nel caricamento del blog. <a href="" class="underline">Riprova</a></p>`;
        }
    }
}

function _pexelsUrl(base, w, h) {return BlogMarkup.pexelsUrl(base, w, h);}

function renderPost(post, options = {}) {
    const safeContent = options.hydrate ? null : DOMPurify.sanitize(post.content);

    // Aggiorna meta tag dinamicamente per ogni post
    document.title = `${post.title} — Subingresso.it`;
    const _sm = (id, val) => { const el = document.getElementById(id); if (el && val) el.setAttribute('content', val); };
    const _desc = post.excerpt || post.title;
    _sm('metaBlogDesc', _desc);
    _sm('ogBlogTitle',  `${post.title} — Subingresso.it`);
    _sm('ogBlogDesc',   _desc);
    const postUrl = `https://subingresso.it/blog?post=${encodeURIComponent(post.slug)}`;
    _sm('ogBlogUrl', postUrl);
    const canon = document.getElementById('canonicalBlog');
    if (canon) canon.href = postUrl;

    // og:image dinamico (1200x630 = standard OG / Discover). Fallback su una foto generica se l'articolo non ha cover (per non rompere lo share sui social).
    const cover = post.cover_image_url || '';
    const ogBase = cover || 'https://images.pexels.com/photos/1187299/pexels-photo-1187299.jpeg';
    const ogImage = _pexelsUrl(ogBase, 1200, 630);
    _sm('ogBlogImage', ogImage);
    _sm('twitterImage', ogImage);

    // JSON-LD NewsArticle (preferito da Google Discover) con image array a 3 aspect ratios.
    const _ld = {
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": post.title,
        "description": _desc,
        "datePublished": post.published_at,
        "dateModified": post.published_at,
        "url": postUrl,
        "inLanguage": "it-IT",
        "author":    { "@type": "Organization", "name": post.author || "Redazione Subingresso", "url": "https://subingresso.it" },
        "publisher": { "@type": "Organization", "name": "Subingresso.it", "url": "https://subingresso.it" }
    };
    // NewsArticle richiede image. Discover predilige 3 aspect ratios: 16:9, 4:3, 1:1. Sempre populato (anche fallback).
    _ld.image = [
        _pexelsUrl(ogBase, 1200, 675),
        _pexelsUrl(ogBase, 1200, 900),
        _pexelsUrl(ogBase, 1200, 1200),
    ];
    let _ldEl = document.getElementById('_ldBlog');
    if (!_ldEl) { _ldEl = document.createElement('script'); _ldEl.id = '_ldBlog'; _ldEl.type = 'application/ld+json'; document.head.appendChild(_ldEl); }
    _ldEl.textContent = JSON.stringify(_ld);

    if (_IS_BANDI) document.getElementById('bannerValutatore')?.classList.add('hidden');
    if (!options.hydrate) container.innerHTML = BlogMarkup.articleMarkup(post, safeContent);
    // Nascondi la promo Vetrina agli utenti già loggati (NON il form Avvisi: vale anche per loggati).
    _supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) document.querySelectorAll('.blog-promo').forEach(el => el.remove());
    });

    // 2.3 — Bind del form Avvisi se presente nel DOM (solo bandi).
    if (_IS_BANDI) _bindBandoAlertForm(_BLOG_REGIONE, post.slug);

    // Geografia e rotazione risolte dal server per tutti gli articoli, inclusi fiere e guide.
    _loadBandoListingsBox(_BLOG_REGIONE, post.slug);

    // 3.3 — Link città inline (prima occorrenza, max 5 per articolo).
    _injectInlineCityLinks(document.getElementById('blogPostContent'), _BLOG_REGIONE);

    BlogFierePromo.mount(document.getElementById('blogPostContent'), post, SLUG_TO_REGIONE);

    // 4.1 — JSON-LD FAQPage solo sui bandi-* (rich result Google).
    _injectFaqJsonLd(_BLOG_REGIONE);

    // 4.1b — JSON-LD FAQPage sull'hub Bolkestein (sovrascrive _ldFaq se attivo).
    _injectBolkesteinFaqJsonLd();

    // 4.2 — Box "Bandi in regioni vicine" con 3 card geograficamente vicine.
    if (_IS_BANDI) _renderRelatedBandi(_BLOG_REGIONE, _allPosts);

    // Hide blog_promo banner per utenti loggati (era mostrato a tutti — niente senso al click "Registrati"
    // se sei già dentro). Async senza bloccare il render.
    try {
        _supabase.auth.getSession().then(function(r){
            if (r && r.data && r.data.session) {
                document.querySelectorAll('.blog-promo').forEach(function(el){ el.style.display = 'none'; });
            }
        }).catch(function(){});
    } catch (_) {}
}

function renderList(posts) {
    container.innerHTML = BlogMarkup.listMarkup(posts, BlogFierePromo.card({slug:'',title:''}, 'index', SLUG_TO_REGIONE));
}

document.addEventListener('DOMContentLoaded', loadBlog);
</script>
